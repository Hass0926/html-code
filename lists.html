<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lists</title>
</head>
<body>
    <h2> Ordered List Exmaple</h2>
    <ol type="I">
    <li>Google</li>
    <li>Facebook</li>
    <li>Gmail</li>
    <li>Instagram</li>
    <li>Snapchat</li>
    </ol>
    <h2> Unordered List Exmaple</h2>
    <ul type="circle"> <!-- circle , none, Square,disc -->
        <li>PWC</li>
        <li>Deloite</li>
        <li>KMPG</li>
        <li>JP MORGAN </li>
    </ul>
    <h2> Discriptive lists </h2>
    <dl>
        <dt> ATM </dt>
        <dd> Automatic Teller Machine</dd>
        <dt> HTML</dt>
        <dd> Hyper text Markup Language</dd>
    </dl>
</body>
</html>
